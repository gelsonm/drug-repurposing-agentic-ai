[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drug-repurposing-v2"
version = "2.0.0"
description = "Biologically-Grounded Drug Repurposing with Agentic AI (v2)"
requires-python = ">=3.10"

dependencies = [
    # LLM
    "openai>=1.40.0",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.2.0",
    # Agent framework
    "crewai>=0.80.0",
    # Data / ML
    "chromadb>=0.5.0",
    "sentence-transformers>=2.2.0",
    "networkx>=3.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    # APIs
    "httpx>=0.25.0",
    "requests>=2.31.0",
    # Data validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # App
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
