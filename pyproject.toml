[project]
name = "drug-repurposing-agents"
version = "0.1.0"
description = "Multi-agent AI system for drug repurposing using CrewAI, Groq, and public biomedical databases"
requires-python = ">=3.11"
dependencies = [
    # Orchestration
    "crewai>=0.80.0,<1.0.0",
    "crewai-tools>=0.14.0,<1.0.0",
    # LLM / Inference
    "langchain-groq>=0.2.0",
    "groq>=0.11.0",
    # Vector Store / RAG
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    # Knowledge Graph
    "networkx>=3.3",
    # Data Models
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # HTTP Clients
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "tenacity>=8.3.0",
    # Report Generation
    "jinja2>=3.1.4",
    "markdown>=3.6",
    # UI
    "streamlit>=1.36.0",
    "plotly>=5.22.0",
    "pandas>=2.2.0",
    # Utilities
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "loguru>=0.7.2",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
